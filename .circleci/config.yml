version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:22.23
    working_directory: ~/ExampleApplication
    steps:
      - checkout
      - restore_cache:
          keys:
            - dependency-cache-{{ checksum "package-lock.json" }}
      - run:
          name: install-npm
          command: npm install
      - save_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}
          paths:
            - ./node_modules

workflows:
  build:
    jobs:
      - build:
          filters:
            branches:
              only:
                - main
